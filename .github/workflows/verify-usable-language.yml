name: Verify usable Losica

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install engine
        run: python -m pip install -e ".[test]"
      - name: Test persistent-state translation
        run: |
          python -m pytest -q \
            tests/test_v021_generator.py::test_identical_consonants_degeminate_before_cluster_repair \
            tests/test_v021_generator.py::test_always_been_like_this_translates_compositionally
      - name: Generate usable language
        run: |
          mkdir -p dist/usable
          python FINALIZE_LEGACY_LANGUAGE.py \
            --seed 19020 \
            --out dist/usable/language.json
          python USE_LEGACY_LANGUAGE.py \
            dist/usable/language.json \
            translate "I always been like this" \
            > dist/usable/translation.json
          cat dist/usable/translation.json
          cp README.md dist/usable/
          cd dist
          zip -qr losica-usable-language.zip usable
      - name: Upload usable language
        uses: actions/upload-artifact@v4
        with:
          name: losica-usable-language
          path: dist/losica-usable-language.zip
          if-no-files-found: error
          retention-days: 30
