name: Verify Losica changes

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install engine
        run: python -m pip install -e ".[test]"
      - name: Run complete test suite
        run: python -m pytest -q
      - name: Generate causal language
        run: |
          mkdir -p dist
          python FINALIZE_LANGUAGE.py \
            --seed 19020 \
            --vocabulary-scale large \
            --out dist/language.json
      - name: Upload verified language
        uses: actions/upload-artifact@v4
        with:
          name: losica-evidence-grounded-language
          path: dist/language.json
          if-no-files-found: error
          retention-days: 30
