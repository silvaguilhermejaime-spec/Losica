name: Verify consonant degemination

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install engine
        run: python -m pip install -e ".[test]"
      - name: Test degemination
        run: |
          python -m pytest -q \
            tests/test_v021_generator.py::test_identical_consonants_degeminate_before_cluster_repair \
            tests/test_causal_engine.py::test_generated_forms_have_no_unsimplified_double_consonants \
            tests/test_causal_engine.py::test_degemination_distinguishes_k_from_glottalized_k
      - name: Generate causal language
        run: |
          mkdir -p dist
          python FINALIZE_LANGUAGE.py \
            --seed 19020 \
            --vocabulary-scale large \
            --out dist/language.json
      - name: Upload verified language
        uses: actions/upload-artifact@v4
        with:
          name: losica-degeminated-language
          path: dist/language.json
          if-no-files-found: error
          retention-days: 30
