name: Build working Losica

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-working-language:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Losica
        run: python -m pip install -e ".[test]"
      - name: Test working-language layer
        run: python -m pytest -q tests/test_working_language.py tests/test_semantic_kernel.py tests/test_planetary_register.py
      - name: Build semantic kernel and expansion
        run: |
          python BUILD_SEMANTIC_LANGUAGE.py --kernel-only --out semantic-kernel.json
          python BUILD_SEMANTIC_LANGUAGE.py --out semantic-language.json
      - name: Build compact working language
        run: python BUILD_WORKING_LANGUAGE.py --out working-language.json
      - name: Build reversible planetary register
        run: python BUILD_PLANETARY_REGISTER.py --out planetary-register.json
      - name: Verify example translations
        run: |
          python USE_WORKING_LANGUAGE.py translate working-language.json "Can you buy bread for me today?"
          python USE_WORKING_LANGUAGE.py translate working-language.json "It's always been like this"
          python USE_PLANETARY_REGISTER.py planetary-register.json say fact:mean_solar_day
          python USE_PLANETARY_REGISTER.py planetary-register.json say fact:formation_cloud_unknown
      - name: Upload working language
        uses: actions/upload-artifact@v4
        with:
          name: losica-working-language
          path: working-language.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload semantic kernel and expansion
        uses: actions/upload-artifact@v4
        with:
          name: losica-semantic-language
          path: |
            semantic-kernel.json
            semantic-language.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload planetary register
        uses: actions/upload-artifact@v4
        with:
          name: losica-planetary-register
          path: planetary-register.json
          if-no-files-found: error
          retention-days: 30
